syntax = "proto3";

package dispatcher.v1;

import "google/protobuf/struct.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// Defines the import path that should be used to import the generated package,
// and the package name.
option go_package = "github.com/zalgonoise/go-webhook-challenge/pb;pb";


// These annotations are used when generating the OpenAPI file.
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  swagger: "2.0"
  info: {
    title: "Dispatcher"
    version: "1.0"
    description: "Allows processing of payment events via webhook."
  }
  schemes: HTTP
  host: "localhost:8080"
  tags: [
    {
      name: "Dispatcher"
      description: "Service that processes payment events via webhook."
    }
  ]
  responses: {
    key: "401"
    value: {
      description: "Unauthenticated"
      schema: {
        json_schema: {
          ref: "#/definitions/rpcStatus"
        }
      }
    }
  }
  responses: {
    key: "403"
    value: {
      description: "Unauthorized"
      schema: {
        json_schema: {
          ref: "#/definitions/rpcStatus"
        }
      }
    }
  }
};

service DispatcherService {
  rpc Dispatch(DispatchRequest) returns (DispatchResponse) {
    option (google.api.http) = {
      post: "/v1/dispatch"
      body: "*"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Dispatches a payment processing request."
      description: "This endpoint accepts payment processing requests via webhook."
      tags: "Dispatcher"
    };
  }
}

message DispatchJob {
  string id = 1 [json_name="id"];
  string event_type = 2[json_name="event_type"];
  bytes payload = 3 [json_name="payload"];
  string destination_url = 4 [json_name="destination_url"];
  string signature = 5 [json_name="signature"];
  Status status = 6 [json_name="status"];
  int32 attempt_count = 7 [json_name="attempt_count"];
  google.protobuf.Timestamp next_retry_at = 8 [json_name="next_retry_at"];
  google.protobuf.Timestamp created_at = 9 [json_name="created_at"];
  google.protobuf.Timestamp updated_at = 10 [json_name="updated_at"];
}

message DispatchRequest {
  string event_type = 1 [json_name="event_type", (validate.rules).string.min_len = 1];
  string destination_url = 2 [json_name="destination_url", (validate.rules).string.min_len = 1];
  google.protobuf.Struct data = 3 [json_name="data", (validate.rules).message.required = true];
}

message DispatchResponse {
  Status status = 1 [json_name="status"];
  string job_id = 2 [json_name="job_id"];
}

enum Status {
  StatusUndefined = 0;
  StatusPending = 1;
  StatusProcessing = 2;
  StatusCompleted = 3;
  StatusFailed = 4;
  StatusDropped = 5;
}